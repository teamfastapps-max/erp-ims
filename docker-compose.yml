services:
  vims-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vims:dev
    container_name: vims-app-dev
    depends_on:
      vims-db:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=vims-db,1433;Database=VIMS;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True;
    ports:
      - "8081:8080"
    restart: unless-stopped

  vims-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vims-db-dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - vims_mssql_data:/var/opt/mssql
      - ../erp_vims_db:/database:ro
    restart: unless-stopped

volumes:
  vims_mssql_data:
